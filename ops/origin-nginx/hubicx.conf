# Hubicx origin (single server). HTTP-only template: after DNS points here run
#   certbot --nginx -d hubicx.ru -d www.hubicx.ru -d api.hubicx.ru -d webapp.hubicx.ru -d admin.hubicx.ru
# and certbot adds TLS and the HTTP→HTTPS redirects.
#
# Static files are served from /opt/ai_aggregator/webapp/public, everything else is
# proxied to the containers published on 127.0.0.1 (backend :8000, webapp :3000).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ===== API =====
server {
    listen 80;
    listen [::]:80;
    server_name api.hubicx.ru;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # SSE streaming of chat answers
        proxy_read_timeout 300s;
    }
}

# ===== LANDING (every call to action opens the Telegram bot) =====
server {
    listen 80;
    listen [::]:80;
    server_name hubicx.ru www.hubicx.ru;

    client_max_body_size 100m;

    location = /robots.txt {
        root /opt/ai_aggregator/webapp/public;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /app/assets/ {
        root /opt/ai_aggregator/webapp/public;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /blog/ {
        root /opt/ai_aggregator/webapp/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /pages/ {
        root /opt/ai_aggregator/webapp/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        root /opt/ai_aggregator/webapp/public;
        try_files /desktop.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== TELEGRAM MINI APP =====
server {
    listen 80;
    listen [::]:80;
    server_name webapp.hubicx.ru;

    client_max_body_size 100m;

    location = /app/index.html { return 301 /; }

    location = /robots.txt {
        root /opt/ai_aggregator/webapp/public;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /app/assets/ {
        root /opt/ai_aggregator/webapp/public;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /blog/ {
        root /opt/ai_aggregator/webapp/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /pages/ {
        root /opt/ai_aggregator/webapp/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # SSE streaming of chat answers
        proxy_read_timeout 300s;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        rewrite ^ /app/index.html break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== ADMIN PANEL =====
server {
    listen 80;
    listen [::]:80;
    server_name admin.hubicx.ru;

    root /opt/ai_aggregator/webapp/public/app;
    index admin.html;

    location ^~ /app/assets/ {
        root /opt/ai_aggregator/webapp/public;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        root /opt/ai_aggregator/webapp/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /admin.html;
    }
}
