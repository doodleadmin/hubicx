proxy_cache_path /var/cache/nginx/hubicx_webapp_static
    levels=1:2
    keys_zone=hubicx_webapp_static:100m
    max_size=10g
    inactive=30d
    use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name webapp.hubicx.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webapp.hubicx.ru;

    ssl_certificate /etc/letsencrypt/live/webapp.hubicx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webapp.hubicx.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/webapp_proxy.access.log;
    error_log /var/log/nginx/webapp_proxy.error.log warn;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name webapp.hubicx.ru;
    proxy_ssl_verify off;

    proxy_set_header Host webapp.hubicx.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;
    send_timeout 120s;
    proxy_buffer_size 64k;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location ^~ /app/assets/ {
        proxy_pass https://62.113.109.73;
        proxy_cache hubicx_webapp_static;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 5m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Hubicx-Proxy kz always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = / {
        proxy_pass https://62.113.109.73;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /robots.txt {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap_index.xml {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /app {
        proxy_pass https://62.113.109.73/app;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /app/ {
        proxy_pass https://62.113.109.73/app;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ^~ /app/ {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
    }

    location ^~ /api/ {
        proxy_pass https://62.113.109.73;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Hubicx-Proxy kz always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ^~ /blog/ {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
    }

    location ^~ /pages/ {
        proxy_pass https://62.113.109.73;
        add_header X-Hubicx-Proxy kz always;
    }

    location / {
        return 404;
    }
}
